name: Move-Code-To-Deploy-QA
# on:  [push]   
on:    
  push: 
    branches:
      - 'QA'
    paths:
      - 'dags/**'
      - 'utils/**'
      - 'sql/**'
      - 'plugins/**'
  # move code only where there is pull request into QA Branch.
  pull_request:
    branches:
      - 'QA'
    paths:
    - 'dags/**'
    - 'utils/**'
    - 'sql/**'   
    - 'plugins/**'   
  workflow_dispatch:

jobs:  
   Move-Code-To-Deploy-QA: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3         
        with:
          fetch-depth: 0  
        
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.8' 
          
      - name: Install dependencies
        run:  |
          python -m pip install --upgrade pip
          
      - name: 1Find Difference between branch and commit
        id: Finddiff        
        run:  echo "fileswithdepth=$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} | xargs)" >> $GITHUB_OUTPUT
        #run:  echo "::set-output name=fileswithdepth::$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} | xargs)"          
        #run:  echo "::set-output name=fileswithdepth::$(git diff --name-only origin/main origin/${GITHUB_HEAD_REF} | xargs)"          
        shell: bash
      - name: 2get changed files
        id: getfile
        run: |
          echo "files=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | xargs)" >> $GITHUB_OUTPUT
          #echo "::set-output name=files::$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | xargs)"
      - name: 2echo output
        run: |
          echo ${{ steps.getfile.outputs.files }}         
      - name: Move the files to temp directory
        id: Movefiles    
        run:  |        
          echo "Files in previous versus current version: ${{ steps.Finddiff.outputs.fileswithdepth }} "    
          # echo "Files modified in current check in: ${{steps.files.outputs.added_modified}} "
          mkdir -p temp_dags/{utils,plugins,sql}  
          
          # CREATE THE FILE OUTSIDE temp_dags
          touch ./delete_list.txt
          
          myarray="${{ steps.Finddiff.outputs.fileswithdepth }}"
          changelist=(${myarray// / })
          len=${#changelist[@]}
          echo "${myarray} has ${len} elements"    
          for ((i=0; i<${len}; i++)) ; do
            case "${changelist[$i]}" in
              A | M | C | T | "R100" )
                if [ "${changelist[$i]}" = "R100" ]; then  
                  change_file="${changelist[$i+2]}"
                  file_path=$(dirname "${changelist[$i+2]}")
                  file_name=$(basename "${changelist[$i+2]}")
                else
                  change_file="${changelist[$i+1]}"
                  file_path=$(dirname "${changelist[$i+1]}")
                  file_name=$(basename "${changelist[$i+1]}") 
                fi
                 IFS='/'
                read -a root <<< "${file_path}"
                # root="${file_path##*/}"
                echo "${file_path} and ${file_name} with root as ${root[0]}"

                # --- 1. HANDLE FOLDER DELETION ---
                if [[ "$file_path" == *"retd_"* ]]; then
                  # If file_path is "dags/retd_myfolder", this removes "retd_" 
                  # but keeps the rest of the path intact.
                  clean_path=$(echo "$file_path" | sed 's/retd_//g')
                  echo "$clean_path" >> ./delete_list.txt
                  continue 
                fi

                # --- 2. HANDLE INDIVIDUAL FILE DELETION ---
                if [[ "$file_name" == retd_* ]]; then
                  clean_file_name=$(echo "$file_name" | sed 's/retd_//')
                  # Ensure we don't double up on the 'dags/' prefix
                  echo "$file_path/$clean_file_name" >> ./delete_list.txt
                  continue 
                fi
               
                case  "${root[0]}" in 
                  "dags") 
                    echo "  > DAG loop:${file_path}/${file_name}."   
                    cp "${change_file}" temp_dags/ 
                    ;;
                  sql |  utils) 
                    echo "  > OUT loop:${file_path}/${file_name}." 
                    mkdir -p temp_dags/${file_path}  
                    cp --parents "${change_file}" "temp_dags"   
                    echo "file temp_dags/${file_path}  created"
                    ;; 
                esac
                ;;
              R | D)
                echo "-- ${changelist[$i+1]} no action done. "
                ;;
              esac
          done
          
          #cp utils/* temp_dags/utils/
          #cp plugins/* temp_dags/plugins/
          ls -R temp_dags/
          cd temp_dags
        
        
      - name: Upload and Delete S3
        id: upload # specify some ID for use in subsequent steps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION}}  
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_PROD }}   
          DEVOPS_DIR: devops 
          directory: "temp_dags"
        run: |
          pip install boto3
          python ${{ env.DEVOPS_DIR }}/upload_dags_to_s3.py



